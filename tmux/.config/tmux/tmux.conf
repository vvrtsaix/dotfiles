# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message 'tmux config reloaded'

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal features
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on

# Interaction
set -g mouse on
set -s escape-time 3
set -g history-limit 50000

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-p previous-window
bind C-n next-window

# Numbering
set -g base-index 1
setw -g pane-base-index 1

# Window names
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}'

# Status bar
set -g status-position top

# Lualine-bubbles style: rounded pills, light theme (built-in options, no plugins)
set -g status-justify absolute-centre
set -g status-style 'bg=default,fg=#ABB0B6'
set -g status-left-length 100
setw -g window-status-separator ' • '
setw -g window-status-style 'bg=default,fg=#ABB0B6,bold'
setw -g window-status-format ' #W '
setw -g window-status-current-format '#[fg=#1E66F5,bold] #W #[fg=#399EE6]#{?window_zoomed_flag,󰊓 ,}'
setw -g window-status-bell-style 'bg=#4CBF99,fg=#FCFCFC,bold'
setw -g window-status-activity-style 'bg=#1C1F26,fg=#FCFCFC'
# Session pill on the left; blue normally, green while prefix is active
set -g status-left '#{?client_prefix,#[fg=#4CBF99],#[fg=#1E66F5]}#[bg=default]#{?client_prefix,#[bg=#4CBF99],#[bg=#1E66F5]}#[fg=#FCFCFC,bold] #S #[bg=default,nobold]#{?client_prefix,#[fg=#4CBF99],#[fg=#1E66F5]}'
set -g status-right ''
